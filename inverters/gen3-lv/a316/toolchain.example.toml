# Copy to toolchain.local.toml (gitignored) and set what differs on your machine. Environment
# variables of the same names in capitals win over this file (tools/a316env.py). Paths may start
# with ~ and are relative to this directory otherwise.

# exhume = "../../../../Exhume"                  # an Exhume checkout (EXHUME)
# mdk_toolchain = "toolchain"                    # directory of MDK homes MDKnnn (MDK_TOOLCHAIN)
# mdk_home = "toolchain/MDK521"                  # compile home, MDK 5.21 or later (MDK_HOME)
# mdk_libhome = "toolchain/MDK516"               # library home, MDK 5.16 or later (MDK_LIBHOME)
# wine_bin = "/Applications/Wine Devel.app/Contents/Resources/wine/bin"   # (WINE_BIN)
# mdk_licensed_home = "~/keil-wine/drive_c/Keil_v5"   # a licensed MDK (5.21 or later) for gate.py --whole
#                                                  # and modbuild.py (MDK_LICENSED_HOME); unset, they skip
# mdk_licensed_prefix = "~/keil-wine"              # the Wine prefix MDK was installed in, which holds the
#                                                  # licence's registry entries (MDK_LICENSED_PREFIX);
#                                                  # default: the directory above drive_c in the home's path

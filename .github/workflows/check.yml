# Repository hygiene only, for every push and pull request, forks included. The gates run in
# gate.yml, from the encrypted toolchain bundle (docs/development/ci.md).
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repocheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 tools/repocheck.py
